# Mọi tham số chốt (freeze) sau pilot P5, TRƯỚC chiến dịch báo cáo P6; ghi mã băm tệp vào nhật ký.
method:
  method: cov
  d0: 0.95              # r_robot 0.42 + r_người 0.25 + khoảng hở 0.28 (chọn trước, không chỉnh theo kết quả)
  eps: 0.01
  kappa_kind: gauss
  d_fixed: 0.30
  q_acc_pred: 0.5       # = q_acc của bộ bám (nhận dạng)
  sigma_freeze_after: 1.0
  max_people: 4
  max_static: 16         # một điểm gần nhất cho mỗi cung 22.5° (8 cung không biểu diễn được góc lõm, pilot 29/10)
  static_clearance: 0.10
  static_range: 2.5
  stale_after: 0.5
  heuristic: {d_s: 1.0, v_rel_max: 2.0, w_d: 0.5, w_v: 0.3, w_t: 0.2, k_d: 0.8, k_v: 0.5}
nmpc:
  N: 20
  dt: 0.1
  n_slots: 20
  q_pos: 10.0
  q_th: 2.0
  q_term: 5.0
  r_u: 0.1
  r_du: 2.0
  w_slack_l1: 1000.0
  w_slack_l2: 10000.0
  max_iter: 60
  max_cpu_time: 0.08
  input_delay: 0.0      # s; TO_IDENTIFY (P3). Nghiên cứu mô phỏng đặt bằng trễ chấp hành giả định (simstudy.yaml)
reference:
  v_ref: 0.6
  heading_mode: fixed
  goal_tol: 0.15
guard:
  stop_margin: 0.30     # m, vùng dừng cứng quanh thân robot trên quét thô (scan_stop_guard)
  scan_timeout: 0.3
