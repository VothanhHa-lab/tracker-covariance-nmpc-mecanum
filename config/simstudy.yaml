# Configuration of the simulation study. Each parameter states its source:
#   T5 = Table 5 of the CA-NMPC draft (platform specification supplied by the authors, not re-measured)
#   DS = official data sheet (checked on the manufacturer's website on 29/10/2026)
#   AS = assumed - perturbed in the robustness campaign
robot:
  footprint: {value: [0.60, 0.55], source: T5}                 # m, length x width
  radius: {value: 0.41, source: "T5 (half diagonal of 0.60 x 0.55 m)"}
  mass: {value: 12.0, source: T5}                               # kg (not used by the first-order model)
  wheel_radius: {value: 0.05, source: T5}
  lx: {value: 0.20, source: AS}
  ly: {value: 0.22, source: AS}
  v_max: {value: 1.0, source: T5}                               # m/s -> wheel limit v_max / r_w
  omega_max: {value: 1.5, source: T5}                           # rad/s
  tau_model: {value: [0.15, 0.15, 0.12], source: AS}            # model used by the controller
  tau_true_range: {value: [0.12, 0.25], source: AS}             # "true" robot in simulation, random per seed
  actuation_delay: {value: 0.05, source: AS}
  body_acc_max: {value: [1.0, 1.0, 2.0], source: AS}
localization:
  std: {value: [0.03, 0.03, 0.01], source: AS}                  # m, m, rad (AR(1), coefficient 0.95)
lidar:                                                          # RPLIDAR A2
  rate: {value: 10.0, source: "DS (10 Hz, 5–15 Hz)"}
  range_max_used: {value: 8.0, source: "AS (<= 12 m for A2M8/A2M12, DS)"}
  range_accuracy: {value: "1% (≤3 m), 2% (3–5 m), 2.5% (5–25 m)", source: DS}
  centroid_std: {value: 0.05, source: "AS (fluctuation of the leg-cluster centroid while walking)"}
  bearing_std_deg: {value: 0.5, source: "AS (0.45 deg angular resolution of A2M8, DS, plus centroid fluctuation)"}
  delay: {value: 0.05, source: AS}
  p_detect: {value: 0.90, source: AS}
  clutter_per_scan: {value: 0.3, source: AS}
camera:                                                         # RealSense D435i
  rate_detector: {value: 10.0, source: "AS (YOLO on the onboard computer; depth stream 30 fps per DS)"}
  range: {value: [0.3, 3.0], source: "DS (operating range ~0.3–3 m)"}
  fov_h_deg: {value: 69.0, source: "AS (colour FOV; DS only confirmed the 87 deg depth FOV)"}
  depth_std_at_2m: {value: 0.04, source: "AS (~2 % at 2 m, growing with the square of range)"}
  bearing_std_deg: {value: 1.0, source: "AS (centre of the detection box)"}
  delay: {value: 0.15, source: AS}
  p_detect: {value: 0.95, source: AS}
  clutter_per_scan: {value: 0.02, source: AS}
pedestrian:
  speed_mean: {value: 1.1, source: AS}
  ou_sigma: {value: 0.10, source: AS}
  ou_tau: {value: 1.0, source: AS}
campaign:
  dev_seeds: [0, 50]          # development/pilot only
  main_seeds: [1000, 1100]    # main reporting campaign
  robust_seeds: [2000, 2050]  # robustness conditions
  ablation_seeds: [1000, 1100]
identified:
  q_acc: {value: 0.022, source: "ML (fit_cv_q) on 300 pedestrian trajectories of development seeds 0-49; used by tracker and predictor"}
social_force:
  A: {value: 3.0, source: "AS (strength, m/s^2); functional form after Helbing & Molnar"}
  B: {value: 0.5, source: "AS (range, m)"}
  lambda: {value: 0.35, source: "AS (anisotropy)"}
revision:
  cov_inflate: {value: 1.5, source: "calibrate_inflation.py on dev seeds 0-9 (sim_devcal.csv, 50 runs)"}
