# Polar noise models of the people-detection sensors. TO_IDENTIFY: tools/analyze_sensor_noise.py writes the identified
# version (key `identified_from`). The values below are only for software tests.
sensors:
  lidar:
    sigma_r_a: 0.03
    sigma_r_b: 0.01
    sigma_b: 0.01
    fov_half_deg: null       # 360°
    r_max: 8.0
  camera:
    sigma_r_a: 0.05
    sigma_r_b: 0.03
    sigma_b: 0.02
    fov_half_deg: 43.5       # D435i: HFOV ~ 87 deg per datasheet - TO_MEASURE the effective detection field
    r_max: 6.0
