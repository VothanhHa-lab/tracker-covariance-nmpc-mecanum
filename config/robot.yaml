# Robot parameters. Each entry states its source: measured, datasheet, identified or assumed.
# TO_MEASURE values are placeholders for software tests; they MUST be replaced by measured values before experiments.
robot:
  wheel_radius:    {value: 0.05, source: "datasheet (Table 5 of the CA-NMPC draft) - TO_MEASURE with calipers"}
  lx:              {value: 0.20, source: "TO_MEASURE: half distance between front and rear axles"}
  ly:              {value: 0.22, source: "TO_MEASURE: half track width"}
  wheel_speed_max: {value: 20.0, source: "TO_MEASURE: highest stable wheel speed (rad/s), 80 % of saturation"}
  body_acc_max:    {value: [1.0, 1.0, 2.0], source: "assumed; check for no wheel slip in P3"}
  tau:             {value: [0.15, 0.15, 0.12], source: "TO_IDENTIFY: tools/analyze_identification.py"}
  radius:          {value: 0.42, source: "TO_MEASURE: currently from the 0.60 x 0.55 m footprint of Table 5 of the old draft, not re-measured"}
